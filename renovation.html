<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="承日常">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2eee4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10141f" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<title>裝潢報價 · 承日常</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261021170451">
</head>
<body data-page="reno">

  <div id="lockScreen" class="lock-screen">
    <div id="lockLoading" class="lock-card hidden">
      <h1>承日常</h1>
      <p>登入中…</p>
    </div>
    <form id="lockForm" class="lock-card">
      <h1>承日常</h1>
      <input id="passwordInput" type="password" placeholder="輸入密碼" autocomplete="off" required>
      <button type="submit">解鎖</button>
      <p id="lockError" class="error-text"></p>
    </form>
  </div>

  <div id="app" class="app hidden">
    <header class="app-header">
      <div>
        <h1>裝潢報價</h1>
      </div>
      <div class="header-actions">
        <button id="logoutBtn" class="ghost-btn">登出</button>
      </div>
    </header>

    <main class="grid dense">
      <div class="health-toolbar"><button id="openRenoImport" type="button" class="add-primary">＋ 匯入報價</button></div>

      <section class="card reno-summary-card">
        <h2>總覽</h2>
        <div id="renoSummary"></div>
      </section>

      <section class="card reno-list-card">
        <select id="renoVendorSelect" class="reno-vendor-select" aria-label="商家"></select>
        <div id="renoFilter" class="seg-switch seg-small" role="tablist" aria-label="狀態篩選"></div>
        <div id="renoVendors"></div>
      </section>
    </main>

    <p id="statusLine" class="status-line"></p>
  </div>

  <div id="renoImportModal" class="modal-overlay hidden">
    <div class="modal-card form-modal">
      <div class="modal-header">
        <h2>匯入報價</h2>
        <button id="renoImportClose" class="ghost-btn" type="button">✕</button>
      </div>
      <form id="renoImportForm" class="entry-form entry-form-rows modal-form">
        <textarea id="renoImportText" rows="8" placeholder="貼上對話裡給你的報價資料（JSON）…"></textarea>
        <p class="progress-line">同一商家、同一品項名稱再匯入：價格或數量有變就更新並記一輪 history，沒變就略過。</p>
        <p id="renoImportMsg" class="import-msg" role="status"></p>
        <div class="dialog-actions modal-actions">
          <span class="spacer"></span>
          <button id="renoImportBtn" type="submit">檢查並匯入</button>
        </div>
      </form>
    </div>
  </div>

  <div id="renoPayModal" class="modal-overlay hidden">
    <div class="modal-card form-modal">
      <div class="modal-header">
        <h2 id="renoPayTitle">記一筆付款</h2>
        <button id="renoPayClose" class="ghost-btn" type="button">✕</button>
      </div>
      <form id="renoPayForm" class="entry-form entry-form-rows modal-form">
        <div class="form-row">
          <label class="mf">類型
            <select id="renoPayKind">
              <option value="deposit">定金</option>
              <option value="installment">期款</option>
              <option value="final">尾款</option>
              <option value="other">其他</option>
            </select>
          </label>
          <label class="mf">日期（選填）
            <input id="renoPayDate" type="date">
          </label>
        </div>
        <label class="mf">金額
          <input id="renoPayAmount" type="number" inputmode="decimal" placeholder="付了多少">
        </label>
        <label class="mf">備註（選填）
          <input id="renoPayNote" type="text" maxlength="200" autocomplete="off">
        </label>
        <p id="renoPayMsg" class="import-msg" role="status"></p>
        <div class="dialog-actions modal-actions">
          <span class="spacer"></span>
          <button id="renoPaySubmit" type="submit">記下</button>
        </div>
      </form>
    </div>
  </div>

  <div id="renoHistoryModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="renoHistoryTitle"></h2>
        <button id="renoHistoryClose" class="ghost-btn" type="button">✕</button>
      </div>
      <div id="renoHistoryBody"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <div id="dialogModal" class="modal-overlay hidden">
    <div class="modal-card dialog-card">
      <p id="dialogMessage"></p>
      <input id="dialogInput" type="text" class="hidden">
      <div class="dialog-actions">
        <button id="dialogCancelBtn" class="ghost-btn" type="button">取消</button>
        <button id="dialogOkBtn" type="button">確定</button>
      </div>
    </div>
  </div>

  <script src="shared.js?v=20261021170451"></script>
  <script src="renovation.js?v=20261021170451"></script>
</body>
</html>
