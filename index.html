<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Hub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="lockScreen" class="lock-screen">
    <form id="lockForm" class="lock-card">
      <h1>Daily Hub</h1>
      <input id="passwordInput" type="password" placeholder="輸入密碼" autocomplete="off" required>
      <button type="submit">解鎖</button>
      <p id="lockError" class="error-text"></p>
    </form>
  </div>

  <div id="app" class="app hidden">
    <header class="app-header">
      <div>
        <h1 id="todayDate"></h1>
        <p id="progressLine" class="progress-line"></p>
      </div>
      <div class="header-actions">
        <button id="shoppingBtn" class="ghost-btn" title="購物清單">🛒</button>
        <button id="logoutBtn" class="ghost-btn">登出</button>
      </div>
    </header>

    <main class="grid">
      <section id="habitsCard" class="card habits-card hidden">
        <h2>習慣與目標 <span id="selectedDateLabel"></span></h2>

        <div id="dailyHabitSection">
          <h3 class="sub-heading">每日習慣</h3>
          <ul id="dailyHabitList" class="item-list"></ul>
        </div>

        <div id="weeklyHabitSection">
          <h3 class="sub-heading">每週目標</h3>
          <ul id="weeklyHabitList" class="item-list"></ul>
        </div>

        <div id="monthlyHabitSection">
          <h3 class="sub-heading">每月目標</h3>
          <ul id="monthlyHabitList" class="item-list"></ul>
        </div>
      </section>

      <section class="card notes-card">
        <h2>新增記事 <span id="selectedDateLabel2"></span></h2>
        <form id="eventForm" class="entry-form entry-form-rows">
          <div class="form-row">
            <input id="eventDate" type="date" required>
            <input id="eventTime" type="time">
          </div>
          <div class="form-row">
            <select id="eventOwner">
              <option value="shared">🤝 一起</option>
              <option value="me">🧑 承承</option>
              <option value="wife">👩 君君</option>
              <option value="林萌">🐕 林萌</option>
              <option value="咪嚕">🐈 咪嚕</option>
            </select>
            <input id="eventTitle" type="text" placeholder="項目…" required>
          </div>
          <div class="form-row">
            <input id="eventNote" type="text" placeholder="備註/地點…">
            <input id="eventAmount" type="number" min="0" placeholder="花費(選填)">
            <button id="eventSubmitBtn" type="submit" disabled>新增</button>
          </div>
        </form>
        <ul id="eventList" class="item-list"></ul>
      </section>

      <section class="card calendar-card">
        <div class="calendar-nav">
          <button id="prevMonth" class="ghost-btn">‹</button>
          <h2 id="monthLabel"></h2>
          <button id="nextMonth" class="ghost-btn">›</button>
        </div>
        <div id="calendarGrid" class="calendar-grid"></div>
      </section>

      <section id="petExpenseCard" class="card pet-expense-card">
        <div class="calendar-nav">
          <button id="petExpensePrev" class="ghost-btn">‹</button>
          <h2 id="petExpenseMonthLabel"></h2>
          <button id="petExpenseNext" class="ghost-btn">›</button>
        </div>
        <select id="petExpenseFilter">
          <option value="all">全部寵物</option>
          <option value="林萌">🐕 林萌</option>
          <option value="咪嚕">🐈 咪嚕</option>
        </select>
        <div id="petExpenseList"></div>
      </section>

      <section class="card new-pet-expense-card">
        <h2>新增寵物花費</h2>
        <form id="petExpenseForm" class="entry-form entry-form-rows">
          <div class="form-row">
            <input id="petExpenseDate" type="date" required>
            <select id="petExpenseOwner">
              <option value="林萌">🐕 林萌</option>
              <option value="咪嚕">🐈 咪嚕</option>
            </select>
          </div>
          <div class="form-row">
            <input id="petExpenseTitle" type="text" placeholder="項目…" required>
            <input id="petExpenseAmount" type="number" min="0" placeholder="金額" required>
            <button id="petExpenseSubmitBtn" type="submit" disabled>新增</button>
          </div>
        </form>
      </section>

      <section class="card goals-card">
        <h2>今日待辦 <span id="selectedDateLabel3"></span></h2>
        <form id="goalForm" class="inline-form">
          <input id="goalInput" type="text" placeholder="新增一個待辦…" required>
          <button type="submit">新增</button>
        </form>
        <ul id="goalList" class="item-list"></ul>
      </section>

      <section class="card new-habit-card">
        <h2>新增習慣</h2>
        <form id="habitForm" class="entry-form">
          <input id="habitName" type="text" placeholder="習慣名稱…" required>
          <select id="habitFrequency">
            <option value="daily">每日</option>
            <option value="weekly">每週</option>
            <option value="monthly">每月</option>
          </select>
          <input id="habitTarget" type="number" min="1" value="1" placeholder="目標次數">
          <label id="habitWorkdaysLabel" class="checkbox-label">
            <input id="habitWorkdaysOnly" type="checkbox">
            僅工作日
          </label>
          <button id="habitSubmitBtn" type="submit" disabled>新增</button>
        </form>
      </section>

      <section class="card recurring-card">
        <h2>循環行程</h2>
        <form id="recurringForm" class="entry-form entry-form-rows">
          <div class="form-row">
            <select id="recurringOwner">
              <option value="shared">🤝 一起</option>
              <option value="me">🧑 承承</option>
              <option value="wife">👩 君君</option>
              <option value="林萌">🐕 林萌</option>
              <option value="咪嚕">🐈 咪嚕</option>
            </select>
            <input id="recurringTitle" type="text" placeholder="項目…" required>
          </div>
          <div class="form-row">
            <select id="recurringFrequency">
              <option value="weekly">每週</option>
              <option value="monthly">每月</option>
            </select>
            <select id="recurringDayOfWeek">
              <option value="0">週日</option>
              <option value="1">週一</option>
              <option value="2">週二</option>
              <option value="3">週三</option>
              <option value="4">週四</option>
              <option value="5">週五</option>
              <option value="6">週六</option>
            </select>
            <input id="recurringDayOfMonth" type="number" min="1" max="31" placeholder="幾號">
            <input id="recurringTime" type="time">
          </div>
          <div class="form-row">
            <input id="recurringNote" type="text" placeholder="備註/地點…">
            <button id="recurringSubmitBtn" type="submit" disabled>新增</button>
          </div>
        </form>
        <ul id="recurringList" class="item-list"></ul>
      </section>
    </main>

    <p id="statusLine" class="status-line"></p>
  </div>

  <div id="toast" class="toast hidden"></div>

  <div id="shoppingModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2>🛒 購物清單</h2>
        <button id="shoppingCloseBtn" class="ghost-btn">✕</button>
      </div>
      <form id="shoppingForm" class="inline-form">
        <input id="shoppingInput" type="text" placeholder="新增購買項目…" required>
        <button type="submit">新增</button>
      </form>
      <ul id="shoppingList" class="item-list"></ul>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
